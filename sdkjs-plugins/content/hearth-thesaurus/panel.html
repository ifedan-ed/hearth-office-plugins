<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1">
		<title>Thesaurus</title>
		<script src="../v1/plugins.js"></script>
		<script src="../v1/plugins-ui.js"></script>
		<link rel="stylesheet" href="../hearth-shared/panel.css">
		<link rel="stylesheet" href="panel.css">
	</head>
	<body>
		<main>
			<form id="find" class="row">
				<input id="word" type="search" aria-label="Word" autocomplete="off">
				<button class="primary" type="submit">Look up</button>
			</form>
			<select id="pack" aria-label="Language" hidden></select>
			<p id="problem" role="alert" hidden></p>
			<p id="state" class="muted" hidden></p>
			<section id="meanings"></section>
		</main>
		<script src="../hearth-shared/theme.js"></script>
		<script src="scripts/lookup.js"></script>
		<script src="scripts/panel.js"></script>
	</body>
</html>
