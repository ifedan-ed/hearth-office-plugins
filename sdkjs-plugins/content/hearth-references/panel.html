<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1">
		<title>References</title>
		<script src="../v1/plugins.js"></script>
		<script src="../v1/plugins-ui.js"></script>
		<link rel="stylesheet" href="panel.css">
	</head>
	<body>
		<!-- The side panel: searching the library and PubMed, the citation
		     being made or edited, the document's citations and its style.
		     It shows and asks; the background page (scripts/main.js) changes
		     the document. -->
		<nav class="tabs" role="tablist">
			<button type="button" role="tab" id="tab-cite" aria-selected="true">Cite</button>
			<button type="button" role="tab" id="tab-list" aria-selected="false">Citations</button>
			<button type="button" role="tab" id="tab-style" aria-selected="false">Style</button>
		</nav>
		<p id="odt" class="note" hidden>Citations in .odt documents are saved as plain text. Keep working in .docx to keep them live.</p>
		<p id="problem" role="alert" hidden></p>
		<p id="status" class="status" role="status" hidden></p>

		<section id="view-cite" class="view">
			<form id="search-form" class="search" role="search">
				<input id="search" type="search" placeholder="Search your library and PubMed" aria-label="Search your library and PubMed" autocomplete="off">
			</form>
			<div id="results" class="results"></div>
			<section id="cluster" class="cluster" hidden>
				<h2 id="cluster-title">Citation</h2>
				<ol id="cluster-items"></ol>
				<div class="row">
					<button id="insert" type="button" class="primary">Insert</button>
					<button id="cancel" type="button">Clear</button>
				</div>
			</section>
		</section>

		<section id="view-list" class="view" hidden>
			<ol id="doc-list" class="doc-list"></ol>
			<p id="doc-empty" class="muted" hidden>No citations yet</p>
			<div class="row">
				<button id="refresh" type="button">Refresh</button>
				<button id="unlink" type="button">Unlink citations</button>
			</div>
			<div id="unlink-ask" class="ask" hidden>
				<p>Turn every citation into plain text? They can no longer be updated.</p>
				<div class="row"><button id="unlink-yes" type="button" class="danger">Unlink</button><button id="unlink-no" type="button">Cancel</button></div>
			</div>
		</section>

		<section id="view-style" class="view" hidden>
			<input id="style-filter" type="search" placeholder="Find a style" aria-label="Find a style" autocomplete="off">
			<ul id="styles" class="styles" role="radiogroup" aria-label="Citation style"></ul>
		</section>

		<script src="scripts/bridge.js"></script>
		<script src="scripts/panel.js"></script>
	</body>
</html>
